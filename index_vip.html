<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091f">
<title>Acesso VIP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;color:#fff;overflow:hidden;background:radial-gradient(ellipse at 18% 15%,rgba(255,82,171,.28),transparent 38%),radial-gradient(ellipse at 85% 85%,rgba(113,68,255,.27),transparent 42%),linear-gradient(145deg,#090713,#170a2b 55%,#090713)}
.glow{position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(80px);opacity:.23;pointer-events:none}
.g1{background:#ff3ea5;top:-150px;right:-100px}.g2{background:#7b4dff;bottom:-180px;left:-90px}
.card{position:relative;width:min(100%,520px);padding:38px 28px 30px;text-align:center;border:1px solid rgba(255,255,255,.15);border-radius:32px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035));box-shadow:0 24px 90px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.12);backdrop-filter:blur(18px)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#f6d8ff;font-size:12px;font-weight:800;letter-spacing:1.8px}
.icon-wrap{width:112px;height:112px;margin:26px auto 24px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(145deg,#ff63bc,#8a43ed);box-shadow:0 12px 40px rgba(219,68,255,.28),inset 0 1px rgba(255,255,255,.55)}
.icon{font-size:52px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
h1{font-size:clamp(31px,8vw,42px);line-height:1.08;letter-spacing:-1.2px;margin:0 0 12px;font-weight:850}
.sub{margin:0 auto 26px;max-width:340px;color:#d6cce4;font-size:16px;line-height:1.55}
.progress{height:10px;border-radius:99px;padding:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#ff4aa9,#d879ff,#8c78ff);animation:fill 2.5s ease-in-out forwards}
.status{display:flex;align-items:center;justify-content:center;gap:9px;margin:19px 0 24px;color:#d6c9e5;font-size:11px;font-weight:800;letter-spacing:1.7px}
.dot{width:8px;height:8px;border-radius:50%;background:#55e5b0;box-shadow:0 0 14px #55e5b0}
button{display:block;width:100%;border:0;border-radius:15px;padding:16px 18px;background:linear-gradient(100deg,#ff4da8,#a34cff);color:white;font-size:16px;font-weight:800;box-shadow:0 10px 28px rgba(198,63,255,.25);cursor:pointer}
button:active{transform:scale(.99)}
.foot{margin-top:18px;color:#a99bb9;font-size:11px}
@keyframes fill{to{width:100%}}
@media(min-width:600px){.card{padding:42px 38px 32px}}
@media(prefers-reduced-motion:reduce){.bar{animation-duration:.2s}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="card">
  <div class="badge">✦ ACESSO EXCLUSIVO</div>
  <div class="icon-wrap"><div class="icon">🔒</div></div>
  <h1>Preparando seu acesso</h1>
  <p class="sub">Você será encaminhado para o grupo no Telegram em instantes.</p>
  <div class="progress" aria-label="Carregando"><div class="bar"></div></div>
  <div class="status"><span class="dot"></span> REDIRECIONAMENTO EM ANDAMENTO</div>
  <button id="continue">Entrar no grupo VIP 👀🎁🌸</button>
  <div class="foot">Se não abrir automaticamente, toque no botão acima.</div>
</main>
<script>
const telegramUrl = "https://t.me/+BELhxEQZF9BlOTdh";
document.getElementById("continue").addEventListener("click",()=>{window.location.href=telegramUrl;});
setTimeout(()=>{window.location.href=telegramUrl;},3000);
</script>
</body>
</html>
